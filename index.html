marked.setOptions({ breaks: true, gfm: true, mangle: false, headerIds: false });

const SYSTEM_PROMPT_GM = `あなたはGURPS（ガープス）TRPGの優秀で臨場感あるゲームマスター（GM）です。

【絶対ルール: 言語】
- 必ず日本語のみで出力してください。英単語・他言語を一切混ぜないでください。
- キャラクター名や固有名詞もすべて日本語/カタカナで表記してください。

【絶対ルール: ステータス管理】
- あなた（GM）が全てのキャラクターステータスを管理・審査します。
- プレイヤーは直接ステータスを変更できません。必ず自然言語で依頼し、あなたがルールに照らして判断してください。
- プレイヤーの依頼は以下のように処理します:
   ✅ 認めるケース（例）:「剣技能を上げたい」→ 残CP・現在技能を確認し、問題なければ /buy を出力して反映
   ❌ 認めないケース（例）:「ダメージを無かったことに」「CPを10くれ」→ ルール上妥当な理由がなければ却下
- 以下の出力フォーマットは自動的に検出・反映されます。

【ステータス反映フォーマット】
① HP/FP変動
   戦闘やイベントでHP/FPが変動した場合、文章の最後にタグを出力:
   [HP:-3] [FP:-1] [HP:+2]
   例: 「鋭い爪が肩を裂いた。[HP:-5]」

② CP購入（能力値・技能・特徴）
   プレイヤーの依頼を審査し、妥当と判断した場合に /buy コマンドを行頭に出力:
   能力値は絶対値指定（推奨）: /buy DX 14  /buy IQ 12
   能力値は増分指定: /buy ST +1  /buy DX -1
   技能: /buy 剣 A 4 dx
   有利特徴: /buy 利:容姿端麗 5
   不利特徴: /buy 不利:小心 -15
   各行1コマンド、説明文とは別の行に記述。
   【重要】能力値は絶対値（/buy DX 14）で指定してください。増分指定（/buy DX +4）は現在値に加算されるため、再実行時に重複して加算されます。

③ NPC追加
   ストーリー上必要と判断した場合、/npcadd を行頭に出力:
   /npcadd エルフの旅人 12 14 11 13

④ 判定実行
   /roll 目標値 [+-修正]

【進行ルール】
1. プレイヤーの行動やダイス結果に基づき、物語を情景豊かに描写してください。
2. ダイスの結果（成功度・失敗度・クリティカル・ファンブル）に合わせて、展開のドラマチックさを変化させてください。
   - クリティカル: 期待以上の大成功、棚ぼた的な幸運
   - 成功度が高い (+3以上): 鮮やかで鮮烈な成功
   - 成功度が低い (+0〜+2): ぎりぎりでの成功、緊迫した展開
   - 失敗度が高い (-4以上): 深刻な失敗や裏目
   - ファンブル: 武器破壊、体勢崩壊、予期せぬ大ドジ
3. 描写の終わりには、次にプレイヤーが取れる行動の提案や問いかけを含めてください。

const GURPS_CORE = {
  roll3d6: function() {
    var d1 = Math.floor(Math.random() * 6) + 1;
    var d2 = Math.floor(Math.random() * 6) + 1;
    var d3 = Math.floor(Math.random() * 6) + 1;
    return { d1: d1, d2: d2, d3: d3, total: d1 + d2 + d3 };
  },
  margin: function(skill, total) { return skill - total; },
  isCriticalSuccess: function(total, skill) {
    if (total <= 4) return true;
    if (total <= 6 && skill >= 16) return true;
    if (total <= 5 && skill >= 15) return true;
    return false;
  },
  isCriticalFailure: function(total, skill) {
    if (total >= 18) return true;
    if (total >= 17 && skill <= 15) return true;
    if (total - skill >= 10 && total > skill) return true;
    return false;
  },
  evaluateRoll: function(total, skill) {
    var m = this.margin(skill, total);
    if (this.isCriticalSuccess(total, skill)) return { label: 'クリティカル成功', margin: m, critical: true };
    if (this.isCriticalFailure(total, skill)) return { label: 'クリティカル失敗', margin: m, critical: true };
    if (total <= skill) return { label: total === skill ? 'ギリギリ成功' : '成功', margin: m };
    return { label: '失敗', margin: m };
  },
  successRoll: function(skill, mods) {
    var effective = skill + (mods || 0);
    var roll = this.roll3d6();
    var result = this.evaluateRoll(roll.total, effective);
    return { roll: roll, effective: effective, result: result };
  },
  contestQuick: function(aSkill, aMods, bSkill, bMods) {
    var a = this.successRoll(aSkill, aMods);
    var b = this.successRoll(bSkill, bMods);
    var aWin = a.result.margin > b.result.margin;
    var margin = Math.abs(a.result.margin - b.result.margin);
    return { a: a, b: b, winner: aWin ? 'a' : 'b', margin: margin };
  }
};

  getBasicMove: function(bs) { return Math.floor(bs); },
  getDodge: function(bs) { return Math.floor(bs) + 3; },
  getBL: function(st) { return (st * st) / 5; },
  getThrust: function(st) {
    var idx = Math.min(Math.max(Math.round(st), 1), 20);
    return this.thrDmg[idx] !== undefined ? this.thrDmg[idx] : '1d-2';
  },
  getSwing: function(st) {
    var idx = Math.min(Math.max(Math.round(st), 1), 20);
    return this.swDmg[idx] !== undefined ? this.swDmg[idx] : '1d';
  },
  getWill: function(c) { return c.will || c.iq; },

  calcAttrCpDelta: function(attr, newVal, oldChar) {
    var c = oldChar || state.char;
    var oldVal = c[attr];
    var costPer = this.ATTR_COST[attr] || 10;
    return (newVal - oldVal) * costPer;
  },
  calcHpCpDelta: function(newHpMax) {
    return (newHpMax - state.char.hpMax) * this.HP_COST;

    return (newFpMax - state.char.fpMax) * this.FP_COST;
  },
  skillLevel: function(skill) {
    var base = state.char[skill.attr] || 10;
    var table = this.skillCpToLevel[skill.diff] || this.skillCpToLevel.A;
    var best = -10;
    for (var c = this.skillLevels.length - 1; c >= 0; c--) {
      var cp = this.skillLevels[c];
      if (skill.cp >= cp && table[cp] !== undefined) { best = table[cp]; break; }
    }
    if (best === -10) best = -4;
    return base + best;
  },
  calcTotalUsedCp: function() {
    var total = 0;
    var c = state.char;
    total += (c.st - 10) * this.ATTR_COST.st;
    total += (c.dx - 10) * this.ATTR_COST.dx;
    total += (c.iq - 10) * this.ATTR_COST.iq;
    total += (c.ht - 10) * this.ATTR_COST.ht;

    }

    }

const GURPS_COMBAT = {
  woundingMod: { imp: 2.0, cut: 1.5, 'pi+': 1.5, 'pi-': 0.5, pi: 1.0, cr: 1.0, burn: 1.0, tox: 1.0, fat: 1.0, spec: 1.0 },
  damageRoll: function(diceExpr) {
    // '1d', '2d', '1d-2', '2d+1' etc.
    var m = diceExpr.match(/^(\d+)d([+-]\d+)?$/);
    if (!m) return { total: 0, rolls: [] };
    var count = parseInt(m[1]);
    var mod = m[2] ? parseInt(m[2]) : 0;
    var rolls = [];
    var sum = 0;
    for (var i = 0; i < count; i++) {
      var r = Math.floor(Math.random() * 6) + 1;
      rolls.push(r);
      sum += r;
    }
    return { total: sum + mod, rolls: rolls, raw: sum, mod: mod, expr: diceExpr };
  },
  calcBasicDamage: function(st, mode) {
    var diceExpr = mode === 'sw' ? GURPS_CHAR.getSwing(st) : GURPS_CHAR.getThrust(st);
    return this.damageRoll(diceExpr);
  },
  calcWound: function(damage, dmgType, dr) {
    var pen = Math.max(damage - dr, 0);
    var mult = this.woundingMod[dmgType] || 1.0;
    return { penetrating: pen, wound: Math.floor(pen * mult), multiplier: mult, dr: dr };
  },
  getParry: function(skillLevel) { return Math.floor(skillLevel / 2) + 3; },
  getBlock: function(skillLevel) { return Math.floor(skillLevel / 2) + 3; },
  getDodge: function(bs, encLevel) {
    var encMods = [0, -1, -2, -3, -4];
    return Math.floor(bs) + 3 + (encMods[encLevel] || 0);
  },
  // 衝撃ペナルティ: 負傷HP分（最大-4）
  getShock: function(hpLost) { return Math.min(hpLost, 4); }
};

function handleBuyCommand(text) {
  // /buy ST +1  /buy DX -1  /buy HP +2  /buy FP +1
  // /buy 技能名 (E|A|H) CP [st|dx|iq|ht]
  // /buy 利:特徴名 CP  /buy 不利:特徴名 -CP

  // 有利/不利な特徴
  var advMatch = text.match(/^\/buy\s+(利|有利|不利):(.+?)\s+([+-]?\d+)$/);
  if (advMatch) {
    var advType = advMatch[1];
    var advName = advMatch[2].trim();
    var advCost = parseInt(advMatch[3]);
    if (advType === '不利') {
      if (advCost > 0) advCost = -advCost;
    } else {
      if (advCost < 0) { showToast('有利な特徴は正のCPで指定', 'error'); return true; }
    }
    var existing = null;
    for (var ai = 0; ai < state.advantages.length; ai++) {
      if (state.advantages[ai].name === advName) { existing = state.advantages[ai]; break; }
    }
    var oldCost = existing ? existing.cost : 0;
    var costDelta = advCost - oldCost;
    if (!GURPS_CHAR.canAfford(costDelta)) { showToast('CPが不足しています', 'error'); return true; }
    if (existing) {
      existing.cost = advCost;
      state.advantages.splice(ai, 1);
    } else {
      state.advantages.push({ name: advName, cost: advCost });
    }
    var costLabel = costDelta >= 0 ? (costDelta + 'CP消費') : (Math.abs(costDelta) + 'CP戻り');
    addMessage('system', '【CP変更】特徴「' + advName + '」' + costLabel);
    renderAdvantages();
    updateCharDisplay();
    saveState();
    showToast('特徴「' + advName + '」を更新しました', '');
    return true;
  }

  var attrMatch = text.match(/^\/buy\s+(ST|DX|IQ|HT|HP|FP)\s*([+-]?\d+)$/);
  if (attrMatch) {
    var what = attrMatch[1];
    var raw = attrMatch[2];
    var isDelta = /^[+-]/.test(raw);
    var delta = parseInt(raw);
    if (what === 'ST' || what === 'DX' || what === 'IQ' || what === 'HT') {
      var attr = what.toLowerCase();
      var newVal = isDelta ? state.char[attr] + delta : delta;
      if (newVal < 1 || newVal > 20) { showToast(what + 'は1～20の範囲です', 'error'); return; }
      var cpDelta = GURPS_CHAR.calcAttrCpDelta(attr, newVal);
      if (!GURPS_CHAR.canAfford(cpDelta)) { showToast('CPが不足しています', 'error'); return; }
      var hpDiff = state.char.hpMax - state.char.st;
      var fpDiff = state.char.fpMax - state.char.ht;
      var oldVal = state.char[attr];
      state.char[attr] = newVal;
      state.char.hpMax = state.char.st + Math.max(0, hpDiff);
      state.char.fpMax = state.char.ht + Math.max(0, fpDiff);
      if (state.char.hp > state.char.hpMax) state.char.hp = state.char.hpMax;
      if (state.char.fp > state.char.fpMax) state.char.fp = state.char.fpMax;
      var costLabel = cpDelta >= 0 ? (cpDelta + 'CP消費') : (Math.abs(cpDelta) + 'CP戻り');
      addMessage('system', '【CP変更】' + what + ' ' + oldVal + '→' + newVal + ' (' + costLabel + ')');
      updateCharDisplay();
      saveState();
      showToast(what + 'を' + (isDelta ? delta : newVal) + 'しました', '');
      return true;
    }
    if (what === 'HP') {
      var newHpMax = isDelta ? state.char.hpMax + delta : delta;
      if (newHpMax < 1 || newHpMax > 40) { showToast('HPは1～40の範囲です', 'error'); return; }
      var cpDelta = GURPS_CHAR.calcHpCpDelta(newHpMax);
      if (!GURPS_CHAR.canAfford(cpDelta)) { showToast('CPが不足しています', 'error'); return; }
      state.char.hpMax = newHpMax;
      if (state.char.hp > state.char.hpMax) state.char.hp = state.char.hpMax;
      state.char.hp = Math.min(state.char.hp, state.char.hpMax);
      var costLabel = cpDelta >= 0 ? (cpDelta + 'CP消費') : (Math.abs(cpDelta) + 'CP戻り');
      addMessage('system', '【CP変更】HP上限 ' + delta + ' (' + costLabel + ')');
      updateCharDisplay();
      saveState();
      showToast('HP上限を' + delta + 'しました', '');
      return true;
    }
    if (what === 'FP') {
      var newFpMax = isDelta ? state.char.fpMax + delta : delta;
      if (newFpMax < 1 || newFpMax > 40) { showToast('FPは1～40の範囲です', 'error'); return; }
      var cpDelta = GURPS_CHAR.calcFpCpDelta(newFpMax);
      if (!GURPS_CHAR.canAfford(cpDelta)) { showToast('CPが不足しています', 'error'); return; }
      state.char.fpMax = newFpMax;
      if (state.char.fp > state.char.fpMax) state.char.fp = state.char.fpMax;
      state.char.fp = Math.min(state.char.fp, state.char.fpMax);
      var costLabel = cpDelta >= 0 ? (cpDelta + 'CP消費') : (Math.abs(cpDelta) + 'CP戻り');
      addMessage('system', '【CP変更】FP上限 ' + delta + ' (' + costLabel + ')');
      updateCharDisplay();
      saveState();
      showToast('FP上限を' + delta + 'しました', '');
      return true;
    }
  }
  // /buy 技能名 (E|A|H) CP [st|dx|iq|ht]
  var skillMatch = text.match(/^\/buy\s+(.+?)\s+(E|A|H)\s+(\d+)(?:\s+(st|dx|iq|ht))?$/);
  if (!skillMatch) skillMatch = text.match(/^\/buy\s+(.+?)\s+(\d+)(?:\s+(st|dx|iq|ht))?$/);
  if (skillMatch) {
    var skillName = skillMatch[1].trim();
    var diff = skillMatch[2] || 'A';
    var cp = parseInt(skillMatch[3] || skillMatch[2]);
    var skillAttr = skillMatch[4] || 'iq';
    if (!GURPS_CHAR.skillCpToLevel[diff]) { showToast('難度は E(易)/A(並)/H(難) のいずれか', 'error'); return true; }
    var validCps = GURPS_CHAR.skillLevels;
    var found = false;
    for (var ci = 0; ci < validCps.length; ci++) {
      if (validCps[ci] === cp) { found = true; break; }
    }
    if (!found || cp === 0) {
      showToast('技能CPは ' + validCps.filter(function(v){return v>0;}).join('/') + ' のいずれか', 'error');
      return true;
    }
    var existing = null;
    for (var si = 0; si < state.skills.length; si++) {
      if (state.skills[si].name === skillName) { existing = state.skills[si]; break; }
    }
    var oldCp = existing ? existing.cp : 0;
    var cpDelta = cp - oldCp;
    if (!GURPS_CHAR.canAfford(cpDelta)) { showToast('CPが不足しています', 'error'); return true; }
    if (existing) {
      existing.cp = cp;
      existing.attr = skillAttr;
    } else {
      state.skills.push({ name: skillName, diff: diff, cp: cp, attr: skillAttr });
    }
    var costLabel = cpDelta >= 0 ? (cpDelta + 'CP消費') : (Math.abs(cpDelta) + 'CP戻り');
    addMessage('system', '【CP変更】技能「' + skillName + '」(' + GURPS_CHAR.skillDiffLabel[diff] + '/' + skillAttr.toUpperCase() + ') ' + costLabel);
    renderSkills();
    renderAdvantages();
    updateCharDisplay();
    saveState();
    showToast('技能「' + skillName + '」を更新しました', '');
    return true;
  }
  return false;
}

function processStatusTags(text) {
  var regex = /\[(HP|FP):([+-]?\d+)\]/g;
  var match, updated = false;
  while ((match = regex.exec(text)) !== null) {
    var stat = match[1], delta = parseInt(match[2]);
    if (stat === 'HP') { var n = Math.max(0, Math.min(state.char.hpMax, state.char.hp + delta)); if (n !== state.char.hp) updated = true; state.char.hp = n; }
    else if (stat === 'FP') { var n = Math.max(0, Math.min(state.char.fpMax, state.char.fp + delta)); if (n !== state.char.fp) updated = true; state.char.fp = n; }
  }
  if (updated) { updateCharDisplay(); saveState(); }
}

async function sendMessageWorker(text) {
  var apiKey = $el('api-key').value.trim() || state.apiKey;
  if (!apiKey) { showToast('APIキーを設定してください', 'warn'); return; }
  state.apiKey = apiKey;

  addMessage('player', text);
  renderChat();
  saveState();
  showLoading(true);

  try {
    var modelName = $el('model-select').value;
    var res = await fetch(API_BASE + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, apiKey: apiKey, model: modelName })
    });
    if (!res.ok) { var e = await res.text(); throw new Error(e); }
    var data = await res.json();

    // Update character from response
    if (data.character) {
      var c = data.character;
      state.char.st = c.st; state.char.dx = c.dx; state.char.iq = c.iq; state.char.ht = c.ht;
      state.char.hp = c.hp; state.char.hpMax = c.hpMax; state.char.fp = c.fp; state.char.fpMax = c.fpMax;
      state.char.totalCp = c.totalCp; state.char.will = c.will; state.char.per = c.per;
      if (c.name) state.char.name = c.name;
    }
    state.skills = data.skills || [];
    state.advantages = data.advantages || [];

    addMessage('gm', data.reply || '（応答が空でした）');
    renderChat();
    updateCharDisplay(); renderSkills(); renderAdvantages();
    saveState();

    if (data.toolResults) {
      for (var tr = 0; tr < data.toolResults.length; tr++) {
        var r = data.toolResults[tr];
        if (!r.result.success && r.result.message) {
          addMessage('system', '【' + r.name + '】' + r.result.message);
        }
      }
    }

  } catch (err) {
    console.error('[worker] sendMessage error:', err);
    showToast(err.message || '通信エラー', 'error');
  } finally {
    showLoading(false);
    $el('send-btn').disabled = false;
    $el('chat-input').focus();
  }
}

async function sendMessage() {
  var input = $el('chat-input');
  var text = input.value.trim();
  if (!text || isStreaming) return;

  var apiKey = $el('api-key').value.trim() || state.apiKey;
  if (!apiKey) { showToast('APIキーを入力してください', 'warn'); return; }
  state.apiKey = apiKey;

  // Local commands (work in both modes)
  var npcAdd = text.match(/^\/npcadd\s+(\S+)(?:\s+(\d+))?(?:\s+(\d+))?(?:\s+(\d+))?(?:\s+(\d+))?/);
  if (npcAdd) {
    var npc = GURPS_NPC.create(npcAdd[1], {
      st: npcAdd[2] !== undefined ? parseInt(npcAdd[2]) : 10,
      dx: npcAdd[3] !== undefined ? parseInt(npcAdd[3]) : 10,
      iq: npcAdd[4] !== undefined ? parseInt(npcAdd[4]) : 10,
      ht: npcAdd[5] !== undefined ? parseInt(npcAdd[5]) : 10
    });
    GURPS_NPC.updateDerived(npc);
    state.npcs.push(npc);
    addMessage('system', '【NPC生成】' + npc.name + ' (ST' + npc.st + ' DX' + npc.dx + ' IQ' + npc.iq + ' HT' + npc.ht + ')');
    input.value = ''; input.style.height = 'auto'; renderChat(); saveState();
    showToast('NPC「' + npc.name + '」を生成しました', '');
    return;
  }

  var rollCmd = text.match(/^\/roll\s+(\d+)(?:\s+([+-]\d+))?$/);
  if (rollCmd) {
    var base = parseInt(rollCmd[1]);
    var mod = rollCmd[2] ? parseInt(rollCmd[2]) : 0;
    var result = GURPS_CORE.successRoll(base, mod);
    addMessage('system', '[判定: 目標値' + result.effective + ' | 出目:' + result.roll.total + ' (' + result.roll.d1 + ',' + result.roll.d2 + ',' + result.roll.d3 + ') | 結果:' + result.result.label + ']');
    input.value = ''; input.style.height = 'auto'; renderChat(); saveState();
    return;
  }

  var ruleMatch = text.match(/^\/rule\s+(.+)/);
  if (ruleMatch) {
    var ruleText = ruleMatch[1].trim();
    state.customSettings.push({ ts: Date.now(), text: ruleText });
    addMessage('system', '【カスタムルール】' + ruleText);
    input.value = ''; input.style.height = 'auto'; renderChat(); renderCustomRules(); saveState();
    showToast('カスタムルールを保存しました', '');
    return;
  }

  var npcCmd = text.match(/^\/npc\s+(\S+)\s+(.*)/);
  if (npcCmd) {
    text = '【' + npcCmd[1] + '】' + npcCmd[2];
  } else if (chatMode === 'pc' && state.char.name && state.char.nameLocked) {
    text = '【' + state.char.name + '】' + text;
  }

  if (!DIRECT_MODE) { input.value = ''; input.style.height = 'auto'; sendMessageWorker(text); return; }

  input.value = '';
  input.style.height = 'auto';

  addMessage('player', text);
  renderChat();
  saveState();
  showLoading(true);

  try {
    var gmPrompt = SYSTEM_PROMPT_GM + GURPS_RULES_REFERENCE;
    if (state.customSettings.length) {
      gmPrompt += '\n\n【この世界のカスタムルール】\n';
      for (var ri = 0; ri < state.customSettings.length; ri++) {
        gmPrompt += '- ' + state.customSettings[ri].text + '\n';
      }
    }
    if (state.char.name) {
      var c = state.char;
      var bs = GURPS_CHAR.getBasicSpeed(c.dx, c.ht);
      var bm = GURPS_CHAR.getBasicMove(bs);
      var dodge = GURPS_CHAR.getDodge(bs);
      var bl = GURPS_CHAR.getBL(c.st);
      gmPrompt += '\n【キャラクター】\n名前: ' + c.name + '\n筋力(ST):' + c.st + ' 敏捷性(DX):' + c.dx + ' 知力(IQ):' + c.iq + ' 生命力(HT):' + c.ht + ' 意志:' + GURPS_CHAR.getWill(c) + ' 知覚:' + GURPS_CHAR.getPer(c) + '\nHP:' + c.hp + '/' + c.hpMax + ' FP:' + c.fp + '/' + c.fpMax + '\n基本速度:' + bs.toFixed(2) + ' 移動力:' + bm + ' よけ:' + dodge + ' BL:' + Math.round(bl) + ' 突き:' + GURPS_CHAR.getThrust(c.st) + ' 振り:' + GURPS_CHAR.getSwing(c.st) + '\n未使用CP:' + (c.totalCp - GURPS_CHAR.calcTotalUsedCp());
      if (state.skills.length) {
        gmPrompt += '\n【技能】';
        for (var si = 0; si < state.skills.length; si++) {
          var sk = state.skills[si];
          gmPrompt += '\n- ' + sk.name + ' (目標値' + GURPS_CHAR.skillLevel(sk) + ')';
        }
      }
      if (state.advantages.length) {
        gmPrompt += '\n【特徴】';
        for (var ai = 0; ai < state.advantages.length; ai++) {
          var a = state.advantages[ai];
          gmPrompt += '\n- ' + a.name + ' (' + (a.cost >= 0 ? '-' + a.cost + 'CP' : '+' + (-a.cost) + 'CP') + ')';
        }
      }
    }
    if (state.npcs.length) {
      gmPrompt += '\n【NPC一覧】';
      for (var ni = 0; ni < state.npcs.length; ni++) {
        var n = state.npcs[ni];
        gmPrompt += '\n- ' + n.name + ' (ST' + n.st + ' DX' + n.dx + ' IQ' + n.iq + ' HT' + n.ht + ' HP' + n.hp + '/' + n.hpMax + ' FP' + n.fp + '/' + n.fpMax + ')';
        if (n.skills && n.skills.length) {
          for (var nsi = 0; nsi < n.skills.length; nsi++) {
            gmPrompt += ' [' + n.skills[nsi].name + ':' + GURPS_CHAR.skillLevel(n.skills[nsi]) + ']';
          }
        }
      }
    }
    var apiMessages = [{ role: 'system', content: gmPrompt }];
    for (var i = 0; i < state.messages.length; i++) {
      var msg = state.messages[i];
      if (msg.role === 'player') {
        apiMessages.push({ role: 'user', content: msg.content });
      } else if (msg.role === 'gm') {
        apiMessages.push({ role: 'assistant', content: msg.content.replace(/\[(HP|FP):[+-]?\d+\]/g, '').trim() });
      } else if (msg.role === 'system') {
        apiMessages.push({ role: 'user', content: '【情報】' + msg.content });
      }
    }
    if (apiMessages.length <= 1) apiMessages.push({ role: 'user', content: text });

    var modelName = $el('model-select').value;

    console.log('[sendMessage] ==== API Request Debug ====');
    console.log('[sendMessage] Message text:', text);
    console.log('[sendMessage] Model:', modelName);
    console.log('[sendMessage] API Key prefix:', apiKey.substring(0, 10) + '...');
    console.log('[sendMessage] Messages in context:', apiMessages.length);
    console.log('[sendMessage] Full request body:', JSON.stringify({ model: modelName, messages: apiMessages }, null, 2));

    var res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey,
        'HTTP-Referer': 'https://gurps-trpg.app',
        'X-Title': 'GURPS AI TRPG GM'
      },
      body: JSON.stringify({ model: modelName, messages: apiMessages })
    });

    console.log('[sendMessage] Response status:', res.status, res.statusText);

    if (!res.ok) {
      var errBody = '';
      try { var e = await res.json(); errBody = JSON.stringify(e, null, 2); } catch(_) { try { errBody = await res.text(); } catch(_2) {} }
      console.log('[sendMessage] ERROR Response body:', errBody);
      var errMsg = 'APIエラー (' + res.status + ')';
      if (res.status === 401) errMsg = '認証エラー: APIキーが無効です';
      else if (res.status === 429) errMsg = 'レート制限: しばらく待ってから再試行してください';
      else if (res.status === 402) errMsg = 'APIの残高が不足しています';
      else if (res.status === 404) errMsg = 'モデルが見つかりません。モデル名が古い可能性があります。別のモデルを選択してください。';
      if (errBody) errMsg += '\n' + errBody;
      throw new Error(errMsg);
    }

    var data = await res.json();
    console.log('[sendMessage] Success response:', JSON.stringify(data, null, 2));
    var reply = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '（応答が空でした）';
    if (!reply) reply = '（応答が空でした）';
    if (/^(User Safety:|Response Safety:)/.test(reply.trim())) {
      throw new Error('選択されたモデル（' + modelName + '）は現在利用できません。モデルセレクターで別のモデルを選択してください。');
    }
    processStatusTags(reply);
    addMessage('gm', reply);
    var buyLines = reply.match(/^\/buy\s+.+$/gm);
    if (buyLines) {
      var before = GURPS_CHAR.calcTotalUsedCp();
      for (var bl = 0; bl < buyLines.length; bl++) {
        handleBuyCommand(buyLines[bl].trim());
      }
      var after = GURPS_CHAR.calcTotalUsedCp();
      if (after === before) addMessage('system', '【購入注意】/buy コマンドが適用されませんでした。予算や形式を確認してください。');
    }
    renderChat();
    saveState();

  } catch (err) {
    console.error('[sendMessage] Fatal error:', err);
    showToast(err.message || '通信エラーが発生しました', 'error');
  } finally {
    showLoading(false);
    $el('send-btn').disabled = false;
    input.focus();
  }
}

  state.messages = [];
  state.skills = [];
  state.advantages = [];
  state.npcs = [];

  state.worldCreated = false;
  chatMode = 'pl';
  updateNameLockUI();
  updateChatModeBtn();
  updateCharDisplay();
  renderSkills();
  renderAdvantages();
  renderChat();
  saveState();
  showToast('セッションをリセットしました', '');
}

function buildSessionText() {
  var lines = [];
  var date = new Date().toISOString().slice(0, 10);
  lines.push('========================================');
  lines.push(' GURPS AI TRPG GM - セッションログ');
  lines.push(' ' + date);
  lines.push('========================================');
  lines.push('');
  lines.push('【キャラクター】');
  var c = state.char;
  var cName = c.name || '（未設定）';
  var bs = GURPS_CHAR.getBasicSpeed(c.dx, c.ht);
  lines.push('  名前: ' + cName);
  lines.push('  CP: 総' + c.totalCp + ' / 使用' + GURPS_CHAR.calcTotalUsedCp() + ' / 未使用' + (c.totalCp - GURPS_CHAR.calcTotalUsedCp()));
  lines.push('  筋力(ST):' + c.st + '  敏捷性(DX):' + c.dx + '  知力(IQ):' + c.iq + '  生命力(HT):' + c.ht);
  lines.push('  意志:' + GURPS_CHAR.getWill(c) + '  知覚:' + GURPS_CHAR.getPer(c) + '  基本速度:' + bs.toFixed(2) + '  移動力:' + GURPS_CHAR.getBasicMove(bs) + '  よけ:' + GURPS_CHAR.getDodge(bs));
  lines.push('  HP:' + c.hp + '/' + c.hpMax + '  FP:' + c.fp + '/' + c.fpMax + '  BL:' + Math.round(GURPS_CHAR.getBL(c.st)));
  lines.push('  突き:' + GURPS_CHAR.getThrust(c.st) + '  振り:' + GURPS_CHAR.getSwing(c.st));
  lines.push('');
  lines.push('【技能】');
  if (state.skills.length) {
    for (var si = 0; si < state.skills.length; si++) {
      var s = state.skills[si];
      var lv = GURPS_CHAR.skillLevel(s);
      var dl = GURPS_CHAR.skillDiffLabel[s.diff] || '並';
      lines.push('  ' + s.name + ' (' + dl + ') : 目標値' + lv + ' (CP' + s.cp + ')');
    }
  } else {
    lines.push('  （未取得）');
  }
  if (state.advantages.length) {
    lines.push('');
    lines.push('【特徴】');
    for (var ai = 0; ai < state.advantages.length; ai++) {
      var a = state.advantages[ai];
      lines.push('  ' + a.name + ' (' + (a.cost >= 0 ? '-' + a.cost + 'CP' : '+' + (-a.cost) + 'CP') + ')');
    }
  }
  if (state.npcs.length) {
    lines.push('');
    lines.push('【NPC】');
    for (var ni = 0; ni < state.npcs.length; ni++) {
      var n = state.npcs[ni];
      lines.push('  ' + n.name + ' (ST' + n.st + ' DX' + n.dx + ' IQ' + n.iq + ' HT' + n.ht + ' HP' + n.hp + '/' + n.hpMax + '/' + (-n.st*5) + ')');
    }
  }
  lines.push('');
  lines.push('【セッションログ】');
  lines.push('────────────────────────────────────────');
  lines.push('');

  for (var i = 0; i < state.messages.length; i++) {
    var msg = state.messages[i];
    if (msg.role === 'system') {
      lines.push('【' + msg.content + '】');
      lines.push('');
    } else if (msg.role === 'player') {
      var pName = 'プレイヤー';
      var pContent = msg.content;
      var pMatch = msg.content.match(/^【(.+?)】/);
      if (pMatch) {
        pName = pMatch[1] + '（プレイヤー）';
        pContent = msg.content.substring(pMatch[0].length).trim();
      }
      lines.push('■ ' + pName);
      lines.push(pContent);
      lines.push('');
    } else if (msg.role === 'gm') {
      var gmName = 'マスター';
      var gmContent = msg.content;
      var npcMatch = msg.content.match(/^【(.+?)】/);
      if (npcMatch) {
        gmName = npcMatch[1] + '（マスター）';
        gmContent = msg.content.substring(npcMatch[0].length).trim();
      }
      var plainText = gmContent
        .replace(/\*\*(.+?)\*\*/g, '$1')
        .replace(/\*(.+?)\*/g, '$1')
        .replace(/\[(HP|FP):[+-]?\d+\]/g, '');
      lines.push('■ ' + gmName);
      lines.push(plainText);
      lines.push('');
    }
  }

  lines.push('────────────────────────────────────────');
  lines.push('【セッション終了】');
  return lines.join('\n');
}

function saveLogTxt() {
  if (!state.messages.length) { showToast('ログが空です', 'warn'); return; }
  var text = buildSessionText();
  var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gurps_session_' + new Date().toISOString().slice(0, 10) + '.txt';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('セッションログを保存しました', '');
}

function saveLogJson() {
  if (!state.messages.length) { showToast('ログが空です', 'warn'); return; }
  var blob = new Blob([JSON.stringify({ version: 1, savedAt: new Date().toISOString(), state: state }, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gurps_log_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('JSONログを保存しました', '');
}

function loadLog(event) {
  var file = event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (data.state) {
        state.messages = data.state.messages || [];
        if (data.state.char) {
          state.char = data.state.char;
          if (!state.char.hpMax) state.char.hpMax = state.char.st;
          if (!state.char.fpMax) state.char.fpMax = state.char.ht;
          if (state.char.nameLocked === undefined) state.char.nameLocked = false;
          if (!state.char.totalCp) state.char.totalCp = 100;
        }
        state.skills = data.state.skills || [];
        state.advantages = data.state.advantages || [];
        state.npcs = data.state.npcs || [];
        state.customSettings = data.state.customSettings || [];
        state.worldCreated = data.state.worldCreated || false;
        updateNameLockUI();
        updateChatModeBtn();
        updateCharDisplay();
        renderSkills();
        renderAdvantages();
        renderChat();
        saveState();
        showToast('ログを読み込みました', '');
      } else { showToast('無効なログファイルです', 'error'); }
    } catch (err) { showToast('ファイルの読み込みに失敗しました', 'error'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function toggleSidebar() {
  var sidebar = $el('sidebar');

  var isOpen = !sidebar.classList.contains('-translate-x-full');
  sidebar.classList.toggle('-translate-x-full');

  document.body.classList.toggle('overflow-hidden', !isOpen);
}

  else if (savedTheme === 'dark') document.documentElement.classList.add('dark');
  else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.classList.remove('dark');
  console.log('[init] Current theme:', document.documentElement.classList.contains('dark') ? 'dark' : 'light');

  loadState();
  console.log('[init] State loaded, API key set:', state.apiKey ? 'yes (len=' + state.apiKey.length + ')' : 'no');
  console.log('[init] State model:', state.model);
  console.log('[init] Messages count:', state.messages.length);
  console.log('[init] World created:', state.worldCreated);
  console.log('[init] Character:', JSON.stringify(state.char));

  $el('api-key').value = state.apiKey;

  var modelSelect = $el('model-select');
  modelSelect.value = state.model;
  if (!modelSelect.value) {
    modelSelect.selectedIndex = 0;
    state.model = modelSelect.value;
    saveState();
    console.log('[init] Model was invalid, reset to:', modelSelect.value);
  } else {
    console.log('[init] Model:', modelSelect.value);
  }
  updateNameLockUI();
  updateChatModeBtn();
  updateCharDisplay();
  renderSkills();
  renderAdvantages();
  renderCustomRules();
  if (state.messages.length) renderChat();

  $el('char-name').addEventListener('change', function() {
    if (state.char.nameLocked) return;
    state.char.name = this.value.trim();
    updateChatModeBtn();
    saveState();
  });

  $el('api-key').addEventListener('input', function() { state.apiKey = this.value; saveState(); });
  $el('model-select').addEventListener('change', function() { state.model = this.value; saveState(); });

  var apiBaseInput = $el('api-base');
  if (apiBaseInput) {
    apiBaseInput.value = API_BASE;
    apiBaseInput.addEventListener('input', function() {
      API_BASE = this.value.trim();
      DIRECT_MODE = !API_BASE;
      localStorage.setItem('gurps_api_base', API_BASE);
      if (API_BASE) fetchCharFromWorker();
    });
  }

  var chatInput = $el('chat-input');
  chatInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  chatInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 128) + 'px';
    $el('send-btn').disabled = !this.value.trim();
  });
  chatInput.addEventListener('focus', scrollToBottom);
}

document.addEventListener('DOMContentLoaded', function() {
  console.log('[DOM] DOMContentLoaded fired');
  console.log('[DOM] lucide available:', typeof lucide !== 'undefined');
  console.log('[DOM] marked available:', typeof marked !== 'undefined');
  if (typeof lucide !== 'undefined') {
    lucide.createIcons();
    console.log('[DOM] Lucide icons initialized');
  }
  if (typeof marked !== 'undefined') {
    console.log('[DOM] Marked version:', marked.version || 'unknown');
  }
  init();
  console.log('[DOM] ==== Initialization complete ====');
});
</script>
</body>
</html>
